# v1.0.0
# v*タグを受け取り、World/AvatarのVPM ZIPをGitHub Releaseへ公開するワークフロー。

name: Release VPM Packages

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build packages
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          python Tools/build_release.py --version "$VERSION" --output Dist

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: gh release create "$GITHUB_REF_NAME" Dist/*.zip --title "Metlab $GITHUB_REF_NAME" --generate-notes
