# v1.0.0
# VPM index.jsonと案内ページをGitHub Pagesへ自動配置するワークフロー。

name: Deploy VPM Listing

on:
  push:
    branches:
      - main
    paths:
      - "Website/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: Website

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
